plugins {
    id 'com.android.application'
}

android {
    namespace 'com.turbrowser'
    compileSdk 35

    defaultConfig {
        applicationId 'com.turbrowser'
        minSdk 24
        targetSdk 35
        versionCode 12
        versionName '1.9.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
